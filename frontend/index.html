<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered immigration timeline planner for international students in the US. Track every visa deadline from OPT to green card." />
    <meta name="theme-color" content="#0A0E27" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VisaPath - AI Immigration Timeline Planner" />
    <meta property="og:description" content="Never miss a visa deadline again. Personalized immigration roadmap from OPT to green card for international students." />
    <meta property="og:url" content="https://visapath-app.azurewebsites.net" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VisaPath - AI Immigration Timeline Planner" />
    <meta name="twitter:description" content="Never miss a visa deadline again. Personalized immigration roadmap from OPT to green card for international students." />

    <title>VisaPath - Immigration Timeline Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback: branded cold-start loading screen -->
    <noscript>
      <div id="app-error" style="display:flex"></div>
    </noscript>
    <script>
      (function() {
        var root = document.getElementById('root');
        var mounted = false;
        var phase = 0; // 0=loading, 1=still loading, 2=failed

        function showColdStart() {
          if (mounted || !root || root.childElementCount > 0) return;
          phase++;
          if (phase === 1) {
            // Phase 1: Branded loading screen (shows after 3s)
            root.innerHTML = '<div id="cold-start" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0E27;font-family:system-ui,sans-serif;padding:24px"><div style="max-width:380px;width:100%;text-align:center"><div style="position:relative;width:80px;height:80px;margin:0 auto 24px"><svg viewBox="0 0 80 80" style="width:100%;height:100%"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(0,212,170,0.1)" stroke-width="3"/><circle cx="40" cy="40" r="34" fill="none" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 164" style="animation:csPin 1.2s linear infinite;transform-origin:40px 40px"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="104 35" transform="rotate(-135 32 32)" fill="none"/><line x1="24" y1="32" x2="38" y2="32" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round"/><polyline points="35,26 41,32 35,38" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div></div><h1 style="font-size:20px;font-weight:700;color:#fff;margin:0 0 8px;letter-spacing:-0.02em">Waking up VisaPath</h1><p id="cs-msg" style="font-size:13px;color:#64748b;margin:0 0 24px;line-height:1.6">Our free-tier server is starting up. This takes 15–30 seconds on first visit.</p><div style="width:200px;height:3px;background:rgba(0,212,170,0.1);border-radius:4px;margin:0 auto;overflow:hidden"><div style="height:100%;width:30%;background:linear-gradient(90deg,#00D4AA,#0ea5e9);border-radius:4px;animation:csBar 2s ease-in-out infinite"></div></div><style>@keyframes csPin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes csBar{0%{width:10%;margin-left:0}50%{width:40%;margin-left:30%}100%{width:10%;margin-left:90%}}</style></div></div>';
            // Phase 2: Update message after 15s more
            setTimeout(function() {
              if (mounted) return;
              var msg = document.getElementById('cs-msg');
              if (msg) msg.textContent = 'Almost there — the server is loading dependencies...';
            }, 15000);
            // Phase 3: Show retry after 40s total
            setTimeout(function() { showFailed(); }, 37000);
          }
        }

        function showFailed() {
          if (mounted || !root || root.childElementCount > 1) return;
          var msg = document.getElementById('cs-msg');
          if (msg) {
            msg.innerHTML = 'Taking longer than expected. <br><button onclick="location.reload()" style="margin-top:12px;padding:8px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#00B892,#00D4AA);color:#0A0E27;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,212,170,0.25)">Reload Page</button>';
          }
        }

        // Show loading after 3 seconds
        window.__csTimer = setTimeout(showColdStart, 3000);

        // Clear everything if React mounts
        if (window.MutationObserver) {
          var obs = new MutationObserver(function() {
            if (root && root.childElementCount > 0) {
              var cs = document.getElementById('cold-start');
              if (cs) cs.remove();
              mounted = true;
              clearTimeout(window.__csTimer);
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true });
        }
      })();
    </script>
  </body>
</html>
