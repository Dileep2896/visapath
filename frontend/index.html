<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered immigration timeline planner for international students in the US. Track every visa deadline from OPT to green card." />
    <meta name="theme-color" content="#0A0E27" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VisaPath - AI Immigration Timeline Planner" />
    <meta property="og:description" content="Never miss a visa deadline again. Personalized immigration roadmap from OPT to green card for international students." />
    <meta property="og:url" content="https://visapath-app.azurewebsites.net" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VisaPath - AI Immigration Timeline Planner" />
    <meta name="twitter:description" content="Never miss a visa deadline again. Personalized immigration roadmap from OPT to green card for international students." />

    <title>VisaPath - Immigration Timeline Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback error screen when JS fails to load -->
    <noscript>
      <div id="app-error" style="display:flex"></div>
    </noscript>
    <script>
      // Show error page if the app hasn't mounted after 8 seconds (asset 404, etc.)
      window.__appTimer = setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0E27;font-family:DM Sans,system-ui,sans-serif;padding:24px"><div style="max-width:440px;width:100%;text-align:center"><div style="position:relative;width:88px;height:88px;margin:0 auto 28px"><svg viewBox="0 0 88 88" style="width:100%;height:100%"><circle cx="44" cy="44" r="38" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="3"/><circle cx="44" cy="44" r="38" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 180" style="animation:errSpin 3s linear infinite;transform-origin:44px 44px"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div><h1 style="font-family:Plus Jakarta Sans,system-ui,sans-serif;font-size:22px;font-weight:700;color:#fff;margin:0 0 10px">Failed to Load</h1><p style="font-size:14px;color:#94a3b8;margin:0 0 28px;line-height:1.6">The application could not be loaded. This might be a temporary issue — try refreshing.</p><button onclick="location.reload()" style="padding:10px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#00B892,#00D4AA);color:#0A0E27;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(0,212,170,0.25)">Reload Page</button><style>@keyframes errSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style></div></div>';
        }
      }, 8000);
      // Clear timeout if React mounts successfully
      if (window.MutationObserver) {
        var obs = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            clearTimeout(window.__appTimer);
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
      }
    </script>
  </body>
</html>
